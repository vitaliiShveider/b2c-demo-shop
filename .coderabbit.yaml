# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
    profile: "chill"
    request_changes_workflow: true
    high_level_summary: true
    poem: true
    review_status: true
    collapse_walkthrough: false
    path_instructions:
        -   path: "**/*Controller.php"
            instructions: |
                Spryker Controller conventions:
                - Only public methods with *Action suffix are allowed as entry points.
                - No business logic, loops, or if statements in controllers.
                - Use castId() for IDs, only receive Request or no parameters.
                - Use getFactory(), getFacade(), getClient() for dependencies.
                - GatewayController is reserved for remote Client requests.
        -   path: "**/*DependencyProvider.php"
            instructions: |
                Spryker DependencyProvider conventions:
                - Only provide*, add*, and get* methods allowed.
                - Use late-binding closures for container::set().
                - All constants must be public.
                - Only inject dependencies via add* methods, one per method.
                - Facades must be wrapped in a Bridge.
                - Plugins must be tagged with @api if get* methods are defined.
        -   path: "**/*Facade.php"
            instructions: |
                Spryker Facade conventions:
                - Only delegate to underlying models, no business logic.
                - All methods must use Transfer objects or native types as arguments and return values.
                - Methods must be public and have descriptive names.
                - Must implement a FacadeInterface with full specification.
                - All public methods must have @api and {@inheritdoc} tags.
        -   path: "**/*FacadeInterface.php"
            instructions: |
                Spryker FacadeInterface conventions:
                - Must specify all public methods of the Facade.
                - Each method must have a clear specification and @api tag.
        -   path: "**/*Factory.php"
            instructions: |
                Spryker Factory conventions:
                - Only instantiate or wire dependencies, no external logic.
                - No interfaces for Factory classes.
                - Methods must be public, named create*() or get*().
                - Use dependency provider constants for module dependencies.
        -   path: "**/Model/*.php"
            instructions: |
                Spryker Model conventions:
                - Grouped by activity (e.g., Writers, Readers).
                - Dependencies injected via constructor, use interfaces.
                - No private methods, no direct instantiation except Transfer objects.
                - No cross-module model inheritance or direct usage.
        -   path: "**/*Config.php"
            instructions: |
                Spryker Config conventions:
                - Getter methods (get*) for config values, not direct constant access.
                - Module config constants should be protected, env config constants public and UPPERCASE.
                - Use static:: for module config, constants prefixed with MODULE_NAME for env config.
        -   path: "**/*.transfer.xml"
            instructions: |
                Spryker Transfer conventions:
                - All new transfers and properties must be marked strict="true".
                - Use correct naming: *Attributes only for Glue API modules.
        -   path: "**/*.schema.xml"
            instructions: |
                Spryker Schema conventions:
                - Table names must use spy_ prefix and follow entity/relation/search/storage format.
                - Primary key: id_entity_name, foreign key: fk_remote_entity.
                - Use phpName attribute for foreign keys.
                - uuid field for external communication, unique, nullable by default.
        -   path: "**/Plugin/**/*.php"
            instructions: |
                Spryker Plugin conventions:
                - Permission plugins must implement PermissionPluginInterface.
                - Use @uses annotation for permission keys in models.
                - Providers and Routers in Yves must extend AbstractYvesControllerProvider or AbstractRouter.
        -   path: "**/Persistence/Propel/Schema/*.xml"
            instructions: |
                Spryker Persistence Schema conventions:
                - Use correct table/column naming, spy_ prefix, phpName, uuid, and foreign key conventions.
        -   path: "**/Transfer/*.php"
            instructions: |
                Spryker Transfer Object conventions:
                - Only getters and setters, no logic.
                - Generated from transfer XML, not hand-written.
        -   path: "**/Repository.php"
            instructions: |
                Spryker Repository conventions:
                - Only retrieve data, no changes.
                - Use Entities/Query Objects, return Transfer objects or native types.
                - Must implement a RepositoryInterface.
        -   path: "**/EntityManager.php"
            instructions: |
                Spryker EntityManager conventions:
                - Only create*, update*, delete* methods, separated by concern.
                - Must implement an interface, use Transfer objects as input/output.
        -   path: "**/Widget/*.php"
            instructions: |
                Spryker Widget conventions:
                - Must be stateless, reusable, and follow atomic design principles.
        -   path: "**/Theme/**"
            instructions: |
                Spryker Theme conventions:
                - Use atomic design: atoms, molecules, organisms, templates, views.
                - Only one-level theme inheritance: current > default.
        -   path: "**/navigation.xml"
            instructions: |
                Spryker navigation.xml conventions:
                - Use <pages> node for navigation items, <bundle> for module, <icon> for Font Awesome icon.
        -   path: "**/*.php"
            instructions: |
                General Spryker Architectural Convention:
                - Each module must have clear separation of layers: Persistence, Business, Communication, and optionally Presentation.
                - Business logic must reside in the Business layer, not in Controllers or Communication layer.
                - Communication layer should only orchestrate calls to the Facade and must not contain business logic.
                - All business logic must be accessed via the Facade.
                - Factories are responsible for creating business objects and injecting dependencies.
                - Custom business logic should be placed in the custom code bucket (src/), not in the core or vendor directories.
                - When extending modules, use code bucket inheritance principles.
                - Module, class, and method names must follow Spryker naming conventions.
                - Each module should be self-contained and not depend on project-specific code outside its own namespace.
                - For data that needs to be available in the frontend, use the Publish & Sync mechanism.
    auto_review:
        enabled: true
        ignore_title_keywords:
            - "WIP"
            - "DO NOT MERGE"
        drafts: false
chat:
    auto_reply: true